services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auditdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auditdb"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_DSN: postgresql://postgres:postgres@db:5432/auditdb
      POOL_MIN_SIZE: "1"
      POOL_MAX_SIZE: "8"
      WORKER_POLL_SECONDS: "0.5"
    ports:
      - "8000:8000"

volumes:
  pgdata:
